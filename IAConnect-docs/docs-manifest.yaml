# =============================================================================
# docs-manifest.yaml — Manifiesto máquina-legible de la documentación de IAConnect
# Marco de Documentación de Software v2.2 §12.2. Un agente calcula el gap documental
# de forma determinística: required_docs − generados − vencidos.
# =============================================================================
manifest_version: "1.0"
generated: "2026-07-15"
generator: "/IA.Prompting.Templates/Tool-Prompts/Documentar-Fuentes-Software.md"
origin_repo: "/NG/Ng-IAServices"
status: draft            # todo el conjunto nace en draft (promoción a approved = humano)
origin: reverse-engineered

solution:
  name: IAConnect
  description: Gateway multi-tenant de IA conversacional (chat/completion/analyze/summarize/improve) sobre .NET 8.
  regulated: false       # true activaría el perfil A.17 (mapeo regulatorio)
  stack: [".NET 8", "ASP.NET Core", "Blazor", "SQL Server 2022", "Docker"]

# -----------------------------------------------------------------------------
# PIEZAS — cada una con su type (§7) y required_docs (documentos exigidos por su perfil)
# -----------------------------------------------------------------------------
pieces:
  - id: IAConnect.Domain
    type: library
    path: IAConnect.Domain/
    criticality: high
    required_docs: [readme, changelog, api-reference]
    generated: [readme]
    gap: [changelog, api-reference]

  - id: IAConnect.Application
    type: library
    path: IAConnect.Application/
    criticality: high
    required_docs: [readme, changelog, api-reference]
    generated: [readme]
    gap: [changelog, api-reference]

  - id: IAConnect.Infrastructure
    type: library
    path: IAConnect.Infrastructure/
    criticality: high
    required_docs: [readme, changelog, api-reference, snippets]
    generated: [readme]
    gap: [changelog, api-reference]

  - id: IAConnect.API
    type: service
    path: IAConnect.API/
    criticality: critical
    required_docs: [readme, changelog, openapi, runbook]
    generated: [readme, openapi, runbook]
    gap: [changelog]

  - id: IAConnect.ChatWidget
    type: component-library
    path: IAConnect.ChatWidget/
    criticality: medium
    required_docs: [readme, changelog, component-catalog, migration-guide, a11y-statement]
    generated: [readme, component-catalog]
    gap: [changelog, migration-guide, a11y-statement]

  - id: IAConnect.Demo.Web
    type: web-portal
    path: IAConnect.Demo.Web/
    criticality: low
    required_docs: [readme, routes-map, a11y-statement]
    generated: [readme, routes-map]
    gap: [a11y-statement]

  - id: IAConnect.Example
    type: library         # sample / PoC de integración
    path: IAConnect.Example/
    criticality: low
    required_docs: [readme]
    generated: [readme]
    gap: []

  - id: IAConnect.Tests
    type: test-support
    path: IAConnect.Tests/
    criticality: medium
    required_docs: [readme]
    generated: [readme]
    gap: []

  - id: IAConnect.Database
    type: database
    path: scripts/01_create_database.sql
    criticality: critical
    required_docs: [data-dictionary, er-model, access-policies, test-data-matrix]
    generated: [data-dictionary, er-model, access-policies, test-data-matrix]
    gap: []
    notes: >
      Documentado por introspección del DDL (scripts/01_create_database.sql) + Models/DataManagers.
      SIN acceso en vivo a la base de datos (no se proveyeron cadenas de conexión): no hay ejemplos con datos
      reales; los fixtures son sintéticos. Gap de introspección en vivo declarado.

# -----------------------------------------------------------------------------
# TIPOS DE DOCUMENTO — dónde vive cada uno, plantilla de referencia y vigencia
# -----------------------------------------------------------------------------
doc_types:
