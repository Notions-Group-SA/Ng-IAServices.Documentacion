# -----------------------------------------------------------------------------
# POLÍTICA DE AGENTES Y GAP GLOBAL
# -----------------------------------------------------------------------------
agent_policy: docs/09-agents/agent-policy.md   # (ver README maestro; política mínima §12.4 aplicada)

known_gaps:
  - id: GAP-DB-LIVE
    description: Sin introspección en vivo de la base de datos (no se proveyeron cadenas de conexión). El modelo se documentó desde el DDL y el código; no hay ejemplos con datos productivos.
    severity: media
  - id: GAP-CHANGELOG
    description: Las piezas no tienen CHANGELOG.md en el origen; no se reconstruye historial de versiones (requiere análisis de git y decisión humana de versión inicial).
    severity: baja
  - id: GAP-APIREF
    description: Referencia de API generada (docstrings→referencia) de las librerías pendiente de herramienta (DocFX); los README de pieza cubren la API pública principal.
    severity: baja
  - id: GAP-A11Y
    description: Declaración de accesibilidad (WCAG) de Widget y Demo.Web pendiente de auditoría de accesibilidad real.
    severity: media

  # --- Divergencias código <-> diseño/doc detectadas en la documentación (código gana; requieren decisión humana) ---
  - id: GAP-RAG-SEMANTIC
    description: >
      El RAG implementado es recuperación léxica TF-IDF en memoria, NO embeddings/similitud coseno como describe
      rag-spec_v1.0.md; Vector_Embedding se guarda null y SerializeEmbedding es código muerto. Ver ADR-0006.
    severity: alta
  - id: GAP-ENC-FALLBACK
    description: >
      El cifrado AES de lut_Tenants.ApiKey_IA usa la clave de la env var IACONNECT_ENCRYPTION_KEY; si falta, hay
      fallback a texto plano (API key en claro en la BD). Además appsettings declara Encryption:AesKey (no usado) y
      compose pasa Encryption__Key: nombres inconsistentes. Requiere hardening.
    severity: alta
  - id: GAP-CONFIG-MODEL
    description: >
      La sección AIProviders:*:DefaultModel de appsettings.json no se consume; el modelo efectivo sale de
      lut_Tenants.Nombre_Modelo. Config potencialmente confusa/muerta.
    severity: baja
  - id: GAP-LAYER-INVERSION
    description: >
      IAConnect.Infrastructure.csproj referencia a IAConnect.Application (Infra->App), invirtiendo la regla de
      dependencia de Clean Architecture. Ver ADR-0001.
    severity: media
  - id: GAP-DB-INTEGRITY
    description: >
      Reglas de integridad solo en app: sys_Metricas_Uso.Proveedor y sys_Mensajes.Proveedor_Usado sin CHECK;
      sin Row-Level Security (aislamiento multi-tenant depende del código); FKs NO ACTION (sin cascada); sin
      política de retención/purga.
    severity: media
  - id: GAP-TEST-COVERAGE
    description: >
      Sin tests: KnowledgeService/Controller, cifrado de API key, persistencia de métricas, providers concretos;
      solo /completion cubierto en integración; GlobalExceptionMiddleware solo verifica InvalidCredentials->401;
      RAGEngine solo prueba el fallback. Sin pruebas contra SQL Server real.
    severity: media
  - id: GAP-CREDS-IN-REPO
    description: >
      Riesgo de exposición: appsettings.Development.json versiona una cadena con credenciales; el encabezado de
      scripts/01_create_database.sql trae servidor/usuario/clave de ejemplo; compose usa sa/TrustServerCertificate.
      No reproducidos en la documentación; requieren limpieza/rotación en el origen.
    severity: alta

validation:
  - "Toda pieza del origen figura con type y required_docs."
  - "El gap por pieza = required_docs − generated."
  - "Ningún entregable contiene credenciales, API keys ni datos productivos."
  - "Todo documento está en status: draft, origin: reverse-engineered."
