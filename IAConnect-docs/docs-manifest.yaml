    path_pattern: "docs/pieces/*/README.md"
    max_age_days: 180
  openapi:
    path_pattern: "docs/05-apis/openapi.yaml"
    max_age_days: 90
  runbook:
    path_pattern: "docs/07-operations/*.md"
    max_age_days: 180
  component-catalog:
    path_pattern: "docs/pieces/IAConnect.ChatWidget/component-catalog.md"
    max_age_days: 120
  routes-map:
    path_pattern: "docs/pieces/IAConnect.Demo.Web/routes-map.md"
    max_age_days: 180
  data-dictionary:
    path_pattern: "docs/03-data/data-dictionary.md"
    max_age_days: 120
  er-model:
    path_pattern: "docs/03-data/er-diagrams/*.dbml"
    max_age_days: 120
  access-policies:
    path_pattern: "docs/03-data/access-policies.md"
    max_age_days: 180
  test-data-matrix:
    path_pattern: "docs/03-data/test-data-matrix.md"
    max_age_days: 120
  adr:
    path_pattern: "docs/04-decisions/*.md"
    max_age_days: 365
  architecture:
