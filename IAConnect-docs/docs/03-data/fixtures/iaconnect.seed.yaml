# Relacionado: ../data-dictionary.md · ../er-diagrams/iaconnect.dbml · ../test-data-matrix.md
#
# SEGURIDAD: TODOS los valores son SINTÉTICOS. No hay API keys, contraseñas,
# hashes ni datos personales reales. Los secretos usan placeholders evidentes
# (SYNTH-*, hashes bcrypt con formato válido pero NO verificables).
#
# Consistencia referencial: las PK IDENTITY (Id) las asigna la BD; para enlazar
# FKs se usan claves lógicas `_ref`. Un cargador debe resolver `_ref` -> Id real
# tras cada INSERT (los tenants usan Id_Tenant natural, no IDENTITY).
# =============================================================================

meta:
  seed: 20260715            # semilla fija para reproducibilidad
  database: IAConnect
  synthetic: true
  pii_safe: true

