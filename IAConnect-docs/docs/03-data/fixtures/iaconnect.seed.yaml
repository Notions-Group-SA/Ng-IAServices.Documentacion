# -----------------------------------------------------------------------------
# NEGATIVE FIXTURES — deben FALLAR al insertarse (ver test-data-matrix.md).
# No cargar en el happy-path; usar en pruebas de validacion de restricciones.
# -----------------------------------------------------------------------------
_negativos:
  - id: NEG-01
    tabla: lut_Tenants
    caso: "Proveedor_IA fuera del CHECK"    # -> TC-03
    data: { Id_Tenant: tenant-bad, Proveedor_IA: mistral, Nombre: X, System_Prompt: X, Nombre_Modelo: X }
    esperado: "Falla CHECK (error 547)"

  - id: NEG-02
    tabla: sys_Usuarios
    caso: "Nombre_Usuario duplicado"        # -> TC-13
    data: { Nombre_Usuario: admin_synth, Password_Hash: "$2a$12$dup", Nombre_Completo: Dup, Rol: admin }
    esperado: "Falla UNIQUE (error 2627)"

  - id: NEG-03
    tabla: sys_Usuarios
    caso: "FK Id_Tenant inexistente"        # -> TC-18
    data: { Nombre_Usuario: huerfano, Password_Hash: "$2a$12$x", Nombre_Completo: H, Rol: operador, Id_Tenant: no-existe }
    esperado: "Falla FK (error 547)"

  - id: NEG-04
    tabla: sys_Mensajes
    caso: "FK Id_Sesion inexistente (huerfano)"  # -> TC-21
    data: { Id_Sesion: 999999, Rol: user, Contenido: "x" }
    esperado: "Falla FK (error 547)"

  - id: NEG-05
    tabla: sys_Mensajes
    caso: "Rol fuera del CHECK"             # -> TC-08
    data: { Id_Sesion_ref: sesion-1, Rol: bot, Contenido: "x" }
    esperado: "Falla CHECK (error 547)"
