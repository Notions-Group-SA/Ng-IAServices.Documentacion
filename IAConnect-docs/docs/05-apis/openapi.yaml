openapi: 3.0.3
info:
  title: IAConnect API
  version: 1.0.0
  description: >
    Gateway multi-tenant de IA conversacional. Enruta chat/completion/analyze/summarize/improve al proveedor
    IA configurado por tenant (Gemini/Claude/OpenAI), con auth JWT, RAG por tenant y métricas de uso.
    Documento inferido por ingeniería inversa; los ejemplos usan datos SINTÉTICOS.
servers:
  - url: http://localhost:5051
    description: Desarrollo (dotnet run)
  - url: http://localhost:8080
    description: Contenedor
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: AI
  - name: Tenants
  - name: Knowledge
  - name: Health
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión y devuelve JWT + refresh token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { nombreUsuario: "operador_demo", contraseña: "S1nthetic-Pass!" }
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Renueva el access token
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: Nuevos tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoca el refresh token (logout)
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '204': { description: Logout exitoso }
        '401': { $ref: '#/components/responses/Error401' }
  /api/auth/usuarios:
    get:
      tags: [Auth]
      summary: Lista usuarios (admin)
      operationId: getUsuarios
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Usuario' } }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Auth]
      summary: Crea un usuario (admin)
      operationId: createUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUsuarioRequest' }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/auth/usuarios/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Auth]
      summary: Obtiene un usuario (admin)
      operationId: getUsuarioById
      responses:
        '200': { description: Usuario, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }
        '404': { $ref: '#/components/responses/Error404' }
    put:
      tags: [Auth]
      summary: Actualiza un usuario (admin)
      operationId: updateUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUsuarioRequest' }
      responses:
        '200': { description: Usuario actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }
        '404': { $ref: '#/components/responses/Error404' }
    delete:
      tags: [Auth]
      summary: Elimina (soft-delete) un usuario (admin)
      operationId: deleteUsuario
      responses:
        '204': { description: Usuario eliminado }
        '404': { $ref: '#/components/responses/Error404' }
  /api/ai/{tenantId}/chat:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [AI]
      summary: Chat multi-turno con memoria y RAG
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
            example: { sessionId: "11111111-1111-1111-1111-111111111111", message: "¿Cuál es el horario de atención?", imageBase64: null }
      responses:
        '200': { description: Respuesta IA, content: { application/json: { schema: { $ref: '#/components/schemas/AIResponse' } } } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
  /api/ai/{tenantId}/completion:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    post:
      tags: [AI]
      summary: Genera texto desde un prompt (stateless, con RAG)
      operationId: completion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompletionRequest' }
      responses:
        '200': { description: Texto generado, content: { application/json: { schema: { $ref: '#/components/schemas/AIResponse' } } } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
  /api/ai/{tenantId}/analyze:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    post:
      tags: [AI]
      summary: Analiza un texto (sentimiento/entidades/categorización)
      operationId: analyze
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalysisRequest' }
            example: { text: "El servicio fue excelente y rápido.", analysisType: "sentimiento" }
      responses:
        '200': { description: Resultado, content: { application/json: { schema: { $ref: '#/components/schemas/AnalysisResponse' } } } }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/ai/{tenantId}/summarize:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    post:
      tags: [AI]
      summary: Resume un texto
      operationId: summarize
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SummarizeRequest' }
      responses:
        '200': { description: Resumen, content: { application/json: { schema: { $ref: '#/components/schemas/SummarizeResponse' } } } }
        '401': { $ref: '#/components/responses/Error401' }
  /api/ai/{tenantId}/improve:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    post:
      tags: [AI]
      summary: Mejora un texto según un objetivo
      operationId: improve
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImproveRequest' }
            example: { text: "porfa manda el reporte cuando puedas", improvementGoal: "formal" }
      responses:
        '200': { description: Texto mejorado, content: { application/json: { schema: { $ref: '#/components/schemas/ImproveResponse' } } } }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
  /api/tenants:
    get:
      tags: [Tenants]
      summary: Lista tenants (admin)
      operationId: getTenants
      responses:
        '200': { description: Lista, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Tenant' } } } } }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [Tenants]
      summary: Crea un tenant (admin)
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenantRequest' }
            example:
              tenantId: "acme-demo"
              name: "ACME Demo"
              aiProvider: "claude"
              systemPrompt: "Sos un asistente de soporte de ACME."
              modelName: "claude-3-sonnet-20240229"
              temperature: 0.7
              maxTokens: 4000
              aiApiKey: "SYNTH-KEY-no-real"
              allowImages: false
              allowedImageFormats: "PNG,JPG,WEBP"
      responses:
        '201': { description: Tenant creado, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '400': { $ref: '#/components/responses/Error400' }
  /api/tenants/{tenantId}:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    get:
      tags: [Tenants]
      summary: Obtiene un tenant (admin)
      operationId: getTenantById
      responses:
        '200': { description: Tenant, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '404': { $ref: '#/components/responses/Error404' }
    put:
      tags: [Tenants]
      summary: Actualiza un tenant (admin)
      operationId: updateTenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTenantRequest' }
      responses:
        '200': { description: Tenant actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '404': { $ref: '#/components/responses/Error404' }
    delete:
      tags: [Tenants]
      summary: Elimina (soft-delete) un tenant (admin)
      operationId: deleteTenant
      responses:
        '204': { description: Tenant eliminado }
        '404': { $ref: '#/components/responses/Error404' }
  /api/tenants/{tenantId}/knowledge:
    parameters: [ { $ref: '#/components/parameters/TenantId' } ]
    post:
      tags: [Knowledge]
      summary: Sube un documento y lo fragmenta para RAG (admin)
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Fragmentos creados
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenantId: { type: string }
                  fileName: { type: string }
                  chunksCreated: { type: integer }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
    get:
      tags: [Knowledge]
      summary: Lista fragmentos de conocimiento (admin)
      operationId: getChunks
      responses:
        '200':
          description: Fragmentos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    documentoOrigen: { type: string }
                    indiceFragmento: { type: integer }
                    contenido: { type: string }
                    fechaAlta: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error403' }
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: health
      security: []
      responses:
        '200': { description: OK }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, maxLength: 50 }
      description: Identificador de negocio del tenant (lut_Tenants.Id_Tenant)
  responses:
    Error400: { description: Datos inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Error401: { description: No autenticado / credenciales inválidas, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Error403: { description: Sin acceso al tenant o rol insuficiente, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Error404: { description: Recurso no encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  schemas:
    ApiError:
      type: object
      description: Formato de error propietario (NO RFC 9457 — ver crosscutting).
      properties:
        error: { type: string }
        statusCode: { type: integer }
    LoginRequest:
      type: object
      required: [nombreUsuario, contraseña]
      properties:
        nombreUsuario: { type: string }
        contraseña: { type: string, format: password }
    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, default: Bearer }
        expiresIn: { type: integer }
        refreshToken: { type: string }
        refreshExpiresIn: { type: integer }
        nombreUsuario: { type: string }
        rol: { type: string, enum: [admin, operador] }
        idTenant: { type: string, nullable: true }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    Usuario:
      type: object
      properties:
        id: { type: integer }
        nombreUsuario: { type: string }
        nombreCompleto: { type: string }
        email: { type: string, nullable: true }
        rol: { type: string, enum: [admin, operador] }
        idTenant: { type: string, nullable: true }
        activo: { type: boolean }
        fechaAlta: { type: string, format: date-time }
        fechaModificacion: { type: string, format: date-time }
    CreateUsuarioRequest:
      type: object
      required: [nombreUsuario, contraseña, nombreCompleto, rol]
      properties:
        nombreUsuario: { type: string }
        contraseña: { type: string, format: password }
        nombreCompleto: { type: string }
        email: { type: string, nullable: true }
        idTenant: { type: string, nullable: true }
        rol: { type: string, enum: [admin, operador] }
    UpdateUsuarioRequest:
      type: object
      properties:
        nombreCompleto: { type: string, nullable: true }
        email: { type: string, nullable: true }
        rol: { type: string, nullable: true }
        contraseña: { type: string, nullable: true, format: password }
        activo: { type: boolean, nullable: true }
    ChatRequest:
      type: object
      required: [message]
      properties:
        sessionId: { type: string, nullable: true, description: "GUID de la sesión; si null, se crea una nueva" }
        message: { type: string }
        imageBase64: { type: string, nullable: true, description: "Imagen en base64 (si el tenant permite imágenes)" }
    CompletionRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
    AnalysisRequest:
      type: object
      required: [text, analysisType]
      properties:
        text: { type: string }
        analysisType: { type: string, description: "Tipo de análisis (ver enum TipoAnalisis)" }
    SummarizeRequest:
      type: object
      required: [document]
      properties:
        document: { type: string }
    ImproveRequest:
      type: object
      required: [text, improvementGoal]
      properties:
        text: { type: string }
        improvementGoal: { type: string, description: "Objetivo (ver enum ObjetivoMejora)" }
    AIResponse:
      type: object
      properties:
        response: { type: string }
        sessionId: { type: string, nullable: true }
        provider: { type: string }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        totalTokens: { type: integer }
    AnalysisResponse:
      type: object
      properties:
        analysisType: { type: string }
        results: { nullable: true, description: "Objeto libre; Analyze intenta parsear la respuesta como JSON" }
        provider: { type: string }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
    SummarizeResponse:
      type: object
      properties:
        summary: { type: string }
        provider: { type: string }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
    ImproveResponse:
      type: object
      properties:
        improvedText: { type: string }
        improvementGoal: { type: string }
        provider: { type: string }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
    Tenant:
      type: object
      properties:
        tenantId: { type: string }
        name: { type: string }
        aiProvider: { type: string, enum: [gemini, claude, openai] }
        systemPrompt: { type: string }
        modelName: { type: string }
        temperature: { type: number, format: double }
        maxTokens: { type: integer }
        allowImages: { type: boolean }
        maxImageSizeKB: { type: integer }
        allowedImageFormats: { type: string }
        isActive: { type: boolean }
        accessTokenExpirationMinutes: { type: integer }
        refreshTokenExpirationDays: { type: integer }
        welcomeMessage: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      description: "NOTA: la API key del proveedor (AiApiKey en request) NO se devuelve en TenantDto."
    CreateTenantRequest:
      type: object
      required: [tenantId, name, aiProvider, systemPrompt, modelName, aiApiKey]
      properties:
        tenantId: { type: string }
        name: { type: string }
        aiProvider: { type: string, enum: [gemini, claude, openai] }
        systemPrompt: { type: string }
        modelName: { type: string }
        temperature: { type: number, format: double, default: 0.7 }
        maxTokens: { type: integer, default: 4000 }
        aiApiKey: { type: string, format: password, description: "Se cifra en reposo (AES); nunca se devuelve" }
        allowImages: { type: boolean }
        maxImageSizeKB: { type: integer, default: 2048 }
        allowedImageFormats: { type: string, default: "PNG,JPG,WEBP" }
        accessTokenExpirationMinutes: { type: integer, default: 60 }
        refreshTokenExpirationDays: { type: integer, default: 7 }
        welcomeMessage: { type: string, nullable: true }
    UpdateTenantRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        aiProvider: { type: string, nullable: true }
        systemPrompt: { type: string, nullable: true }
        modelName: { type: string, nullable: true }
        temperature: { type: number, nullable: true }
        maxTokens: { type: integer, nullable: true }
        aiApiKey: { type: string, nullable: true, format: password }
        allowImages: { type: boolean, nullable: true }
        maxImageSizeKB: { type: integer, nullable: true }
        allowedImageFormats: { type: string, nullable: true }
        isActive: { type: boolean, nullable: true }
        accessTokenExpirationMinutes: { type: integer, nullable: true }
        refreshTokenExpirationDays: { type: integer, nullable: true }
        welcomeMessage: { type: string, nullable: true }
